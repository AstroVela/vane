[build-system]
requires = ["scikit-build-core>=0.11.4", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "vane-fs"
version = "0.1.0"
description = "A SQLite-backed branchable filesystem with a C++ storage core"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0 AND blessing"
license-files = ["LICENSE", "LICENSES/*.txt"]

[project.optional-dependencies]
fsspec = ["fsspec>=2022.11.0"]
test = ["pytest>=8.2", "pytest-timeout>=2.3", "fsspec>=2022.11.0"]

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.29"
wheel.packages = ["python/vane_fs"]
sdist.include = ["/CMakeLists.txt", "/vcpkg.json", "/include/**/*.hpp", "/include/**/*.h", "/src/*.cpp", "/src/*.hpp", "/python/vane_fs/*.py", "/tests/*.py", "/tests/*.cpp", "/benchmarks/*.py", "/benchmarks/*.md", "/benchmarks/*.json", "/LICENSE", "/LICENSES/*.txt"]
sdist.exclude = ["build/**", "vcpkg_installed/**", ".venv/**", ".cache/**", "**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
