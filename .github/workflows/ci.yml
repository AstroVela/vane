name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      run_full: ${{ steps.ci_scope.outputs.run_full }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for source license checks
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check source licenses before classifying changes
        if: github.event_name == 'pull_request'
        run: python -I scripts/check_copyleft.py

      - name: Determine whether full CI is required
        id: ci_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit
          fi

          if git diff --quiet --no-renames "$PR_BASE_SHA" "$PR_HEAD_SHA" --; then
            run_full=true
            echo "No changed files were detected; running full CI."
          elif git diff --quiet --no-renames "$PR_BASE_SHA" "$PR_HEAD_SHA" -- \
            . \
            ':(exclude,glob)**/*.md' \
            ':(exclude,glob).github/ISSUE_TEMPLATE/**' \
            ':(exclude,glob).github/PULL_REQUEST_TEMPLATE/**'; then
            run_full=false
            echo "Only Markdown or static GitHub templates changed; skipping package, native, fast-test, and AI-test CI."
          else
            run_full=true
            echo "A product, build, dependency, or automation file changed; running full CI."
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

  source-package:
    name: Source package (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and validate source package
        run: |
          python -m pip install --upgrade build packaging pip "tomli>=1.1; python_version < '3.11'"
          python -I scripts/check_copyleft.py
          python -m build --sdist --outdir dist
          python scripts/check_release_artifacts.py dist/*.tar.gz

      - name: Apply private content rules to the source package
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        env:
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --content-rules-manifest - \
              dist/*.tar.gz

  native-fast-tests:
    name: Native build and fast tests (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    uses: ./.github/workflows/native-python.yml
    with:
      runner: ubuntu-24.04
      python-version: ${{ matrix.python-version }}
      # Python 3.12 also builds native tests and qualifies signed providers,
      # VaneFS and wheel coexistence before the three isolated release phases.
      timeout-minutes: ${{ matrix.python-version == '3.12' && 360 || 180 }}
    secrets: inherit

  native-macos:
    name: Native build and fast tests (macOS arm64, Python 3.12)
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    uses: ./.github/workflows/native-python.yml
    with:
      runner: macos-15
      python-version: "3.12"
      timeout-minutes: 360
      vcpkg-triplet: arm64-osx-release
      artifact-suffix: -macos
    secrets: inherit

  native-windows:
    name: Native build and fast tests (Windows x64, Python 3.12)
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    uses: ./.github/workflows/native-python.yml
    with:
      runner: windows-2022
      python-version: "3.12"
      timeout-minutes: 360
      vcpkg-triplet: x64-windows-static-release
      artifact-suffix: -windows
    secrets: inherit

  fast-tests:
    name: Fast tests (${{ matrix.label }})
    needs:
      - changes
      - native-fast-tests
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          # Split the expanded native/callback suite over four non-Ray shards.
          # Allow slow CI hosts 10 minutes per test and 60 minutes per process.
          - label: non-Ray 1/4
            phase: non-ray
            shard_index: 0
            shard_count: 4
            process_timeout: 3600
            test_timeout: 600
          - label: non-Ray 2/4
            phase: non-ray
            shard_index: 1
            shard_count: 4
            process_timeout: 3600
            test_timeout: 600
          - label: non-Ray 3/4
            phase: non-ray
            shard_index: 2
            shard_count: 4
            process_timeout: 3600
            test_timeout: 600
          - label: non-Ray 4/4
            phase: non-ray
            shard_index: 3
            shard_count: 4
            process_timeout: 3600
            test_timeout: 600
          - label: shared Ray
            phase: shared-ray
            shard_index: 0
            shard_count: 1
            process_timeout: 2400
            test_timeout: 300
          - label: isolated Ray owners
            phase: owner-ray
            shard_index: 0
            shard_count: 1
            process_timeout: 900
            test_timeout: 300
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TEST_TIMEOUT: ${{ matrix.test_timeout }}
      VANE_FAST_TEST_EXCLUDE_GPU: "1"
      VANE_FAST_TEST_JUNIT_DIR: ${{ github.workspace }}/test-results
      VANE_TEST_DIAGNOSTICS_DIR: ${{ github.workspace }}/test-results/local-runtime
      VANE_FAST_TEST_NON_RAY_SHARD_COUNT: ${{ matrix.shard_count }}
      VANE_FAST_TEST_NON_RAY_SHARD_INDEX: ${{ matrix.shard_index }}
      VANE_FAST_TEST_PROCESS_TIMEOUT_SECONDS: ${{ matrix.process_timeout }}
      VANE_REQUIRE_PACKAGED_DYNAMIC_EXTENSION_PROVIDER: "1"
      VANE_REQUIRE_SIGNED_DYNAMIC_EXTENSION_FIXTURE: "1"
      VANE_TEST_SIGNED_DYNAMIC_EXTENSION_NAME: loadable_extension_demo
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the built wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-python-artifacts-3.12
          path: dist

      - name: Restore the uv package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/uv
          key: fast-tests-uv-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('pyproject.toml') }}

      - name: Install the wheel and CPU test dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --group build --group test duckdb \
            dist/*.whl dist/extension-wheels/*.whl
          uv pip check

      - name: Verify the artifact-installed CPU environment
        working-directory: ${{ runner.temp }}
        env:
          VANE_RUNNER: local-fast
        run: |
          python -I - <<'PY'
          import importlib.metadata
          import pathlib
          import sys

          import _duckdb as official_native
          import duckdb
          import torch
          import vane
          from vane import _native

          distribution = importlib.metadata.distribution("vane-ai")
          extension_path = pathlib.Path(_native.__file__).resolve()
          official_extension_path = pathlib.Path(official_native.__file__).resolve()
          environment_root = pathlib.Path(sys.prefix).resolve()
          if not extension_path.is_relative_to(environment_root):
              raise RuntimeError(f"vane._native was not installed from the wheel: {extension_path}")
          if extension_path == official_extension_path:
              raise RuntimeError("Vane and DuckDB resolved to the same native extension")
          for package in (duckdb, vane):
              package_path = pathlib.Path(package.__file__).resolve()
              if not package_path.is_relative_to(environment_root):
                  raise RuntimeError(f"{package.__name__} was not imported from the wheel: {package_path}")
              print(f"{package.__name__} package: {package_path}")
          if torch.version.cuda is not None or torch.cuda.is_available():
              raise RuntimeError("fast-test jobs must use the CPU-only PyTorch build")
          print(f"installed {distribution.metadata['Name']} {distribution.version}")
          print(f"Vane native extension: {extension_path}")
          print(f"DuckDB native extension: {official_extension_path}")
          print(f"Vane query: {vane.connect().execute('SELECT 42').fetchone()}")
          print(f"DuckDB query: {duckdb.connect().execute('SELECT 43').fetchone()}")
          print(f"PyTorch {torch.__version__}; CUDA unavailable as expected")
          PY

      - name: Run ${{ matrix.label }} fast-test shard
        env:
          FAST_TEST_PHASE: ${{ matrix.phase }}
        run: |
          if [[ "$FAST_TEST_PHASE" == "owner-ray" ]]; then
            # This runner is dedicated to one shard, so Ray daemon cleanup can
            # happen outside pytest without risking an unrelated local cluster.
            export VANE_FAST_TEST_EXTERNAL_RAY_CLEANUP=1
          fi
          scripts/run_fast_tests.sh "$FAST_TEST_PHASE"

      - name: Stop residual Ray processes
        if: ${{ always() && matrix.phase != 'non-ray' }}
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=10s 30s ray stop --force

      - name: Publish the JUnit summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          FAST_TEST_LABEL: ${{ matrix.label }}
        run: |
          python scripts/summarize_junit.py \
            --label "$FAST_TEST_LABEL" \
            "$VANE_FAST_TEST_JUNIT_DIR" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-test-results-${{ matrix.phase }}-${{ matrix.shard_index }}
          path: |
            test-results/*.xml
            test-results/local-runtime/
          if-no-files-found: warn
          retention-days: 14

  gravitino-tests:
    name: Gravitino integration tests
    needs:
      - changes
      - native-fast-tests
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      VANE_TEST_GRAVITINO: provider
      VANE_TEST_GRAVITINO_URL: http://127.0.0.1:8090
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the built wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-python-artifacts-3.12
          path: dist

      - name: Download the matching Gravitino provider
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-gravitino-provider-3.12
          path: dist/gravitino

      - name: Install the built wheels and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall dist/*.whl dist/gravitino/*.whl pytest
          python -m pip check

      - name: Start Gravitino 1.3
        run: |
          gravitino_files="$RUNNER_TEMP/vane-gravitino-files"
          mkdir -p "$gravitino_files"
          chmod 755 "$gravitino_files"
          echo "VANE_TEST_GRAVITINO_SHARED_DIR=$gravitino_files" >> "$GITHUB_ENV"
          docker run --detach \
            --name vane-gravitino \
            --memory 2g --cpus 2 \
            --env GRAVITINO_MEM='-Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m' \
            --env GRAVITINO_AUX_SERVICE_NAMES= \
            --mount "type=bind,source=$gravitino_files,target=$gravitino_files" \
            --publish 127.0.0.1:8090:8090 \
            apache/gravitino:1.3.0@sha256:04c74cee17946865fa20186c032fda2ed7d1722468e2d58aa32114ea3b35b057

      - name: Wait for Gravitino readiness
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent --max-time 2 "$VANE_TEST_GRAVITINO_URL/api/health/ready" > /dev/null; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' vane-gravitino)" != "running" ]]; then
              echo "Gravitino stopped before becoming ready" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Gravitino did not become ready within the startup budget" >&2
          exit 1

      - name: Run native Gravitino acceptance
        run: |
          timeout --signal=INT --kill-after=30s 300s \
            scripts/run_installed_pytest.sh -o addopts= \
              -m 'external_service and not real_ray' tests/fast/test_gravitino_live.py

      - name: Run Ray Gravitino acceptance
        run: |
          timeout --signal=INT --kill-after=30s 300s \
            scripts/run_installed_pytest.sh -o addopts= \
              -m 'external_service and real_ray' tests/fast/test_gravitino_live.py

      - name: Print Gravitino logs on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: docker logs --tail 200 vane-gravitino

      - name: Stop Gravitino
        if: ${{ always() }}
        continue-on-error: true
        run: docker rm --force vane-gravitino

  milvus-tests:
    name: Milvus integration test
    needs:
      - changes
      - native-fast-tests
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      VANE_TEST_MILVUS_URI: http://127.0.0.1:19530
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the built wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-python-artifacts-3.12
          path: dist

      - name: Install the wheel and Milvus test dependencies
        run: |
          python -m pip install --upgrade pip
          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m pip install --force-reinstall "${wheel_path}[milvus]" pytest
          python -m pip check
          python -c 'import pymilvus'

      - name: Start Milvus standalone
        run: |
          milvus_runtime="$RUNNER_TEMP/vane-milvus"
          mkdir -p "$milvus_runtime"
          printf '%s\n' \
            'listen-client-urls: http://0.0.0.0:2379' \
            'advertise-client-urls: http://0.0.0.0:2379' \
            'quota-backend-bytes: 4294967296' \
            'auto-compaction-mode: revision' \
            "auto-compaction-retention: '1000'" \
            > "$milvus_runtime/embedEtcd.yaml"
          printf '%s\n' '# Extra config to override default milvus.yaml' \
            > "$milvus_runtime/user.yaml"
          docker run --detach \
            --name vane-milvus \
            --security-opt seccomp=unconfined \
            --env ETCD_USE_EMBED=true \
            --env ETCD_DATA_DIR=/var/lib/milvus/etcd \
            --env ETCD_CONFIG_PATH=/milvus/configs/embedEtcd.yaml \
            --env COMMON_STORAGETYPE=local \
            --env DEPLOY_MODE=STANDALONE \
            --mount "type=bind,source=$milvus_runtime/embedEtcd.yaml,target=/milvus/configs/embedEtcd.yaml,readonly" \
            --mount "type=bind,source=$milvus_runtime/user.yaml,target=/milvus/configs/user.yaml,readonly" \
            --publish 127.0.0.1:19530:19530 \
            --publish 127.0.0.1:9091:9091 \
            milvusdb/milvus:v3.0.0@sha256:49371c30af46b1013e4d3e0b980e691d81376d69cdbe1b372725baf1d7255862 \
            milvus run standalone

      - name: Wait for Milvus to become healthy
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:9091/healthz > /dev/null; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' vane-milvus)" != "running" ]]; then
              echo "Milvus stopped before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Milvus did not become healthy within 180 seconds" >&2
          exit 1

      - name: Run the live Milvus sink test
        run: |
          timeout --signal=INT --kill-after=30s 300s \
            scripts/run_installed_pytest.sh \
              -o addopts= \
              -m external_service \
              tests/fast/test_milvus_datasink.py

      - name: Print Milvus logs on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: docker logs vane-milvus

      - name: Stop Milvus
        if: ${{ always() }}
        continue-on-error: true
        run: docker rm --force vane-milvus

  qdrant-tests:
    name: Qdrant integration test
    needs:
      - changes
      - native-fast-tests
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      VANE_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the built wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-python-artifacts-3.12
          path: dist

      - name: Install the wheel and Qdrant test dependencies
        run: |
          python -m pip install --upgrade pip
          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          # Metadata response truncation can escape pip's connection retries.
          for attempt in 1 2 3; do
            if python -m pip install --force-reinstall "${wheel_path}[qdrant]" pytest; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          python -m pip check
          python -c 'import qdrant_client'

      - name: Run Qdrant SDK request-size regressions
        run: |
          timeout --signal=INT --kill-after=30s 300s \
            scripts/run_installed_pytest.sh \
              -o addopts= \
              -m 'not external_service and not real_ray' \
              -k request \
              tests/fast/test_qdrant_datasink.py

      - name: Start Qdrant
        run: |
          docker run --detach \
            --name vane-qdrant \
            --publish 127.0.0.1:6333:6333 \
            qdrant/qdrant:v1.19.0@sha256:6c0652f8d6925b22f2f6f0e0a5365a6c9dbc8768bd6e70ccc1cdc14847e452a0

      - name: Wait for Qdrant to become healthy
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:6333/healthz > /dev/null; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' vane-qdrant)" != "running" ]]; then
              echo "Qdrant stopped before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Qdrant did not become healthy within 120 seconds" >&2
          exit 1

      - name: Run the live Qdrant sink test
        run: |
          timeout --signal=INT --kill-after=30s 300s \
            scripts/run_installed_pytest.sh \
              -o addopts= \
              -m external_service \
              tests/fast/test_qdrant_datasink.py

      - name: Print Qdrant logs on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: docker logs vane-qdrant

      - name: Stop Qdrant
        if: ${{ always() }}
        continue-on-error: true
        run: docker rm --force vane-qdrant

  doris-tests:
    name: Doris integration test
    needs:
      - changes
      - native-fast-tests
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      VANE_TEST_DORIS_ENDPOINT: http://127.0.0.1:8030
      VANE_TEST_DORIS_MYSQL_HOST: 127.0.0.1
      VANE_TEST_DORIS_MYSQL_PORT: "9030"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the built wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-python-artifacts-3.12
          path: dist

      - name: Install the wheel and Doris test dependencies
        run: |
          python -m pip install --upgrade pip
          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m pip install --force-reinstall "${wheel_path}[doris]" pymysql pytest
          python -m pip check
          python -c 'import aiohttp, pymysql'

      - name: Start Doris all-in-one
        run: |
          docker run --detach \
            --name vane-doris \
            --publish 127.0.0.1:8030:8030 \
            --publish 127.0.0.1:8040:8040 \
            --publish 127.0.0.1:9030:9030 \
            apache/doris:all-in-one-4.1.3@sha256:4f8ae854f4d282710013f11705c8c867c2086d22df3ea3e4c6160ef0a3363813

      - name: Wait for Doris to become healthy
        run: |
          for attempt in {1..120}; do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' vane-doris)"
            if [[ "$health" == "healthy" ]] && curl --fail --silent http://127.0.0.1:8030/api/health > /dev/null; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' vane-doris)" != "running" ]]; then
              echo "Doris stopped before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Doris did not become healthy within 240 seconds" >&2
          exit 1

      - name: Wait for Doris tablet creation
        run: python scripts/wait_for_doris.py

      - name: Run the live Doris sink test
        run: |
          timeout --signal=INT --kill-after=30s 300s \
            scripts/run_installed_pytest.sh \
              -o addopts= \
              -m external_service \
              tests/fast/test_doris_datasink.py

      - name: Print Doris logs on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: docker logs vane-doris

      - name: Stop Doris
        if: ${{ always() }}
        continue-on-error: true
        run: docker rm --force vane-doris

  ai-tests:
    name: AI tests
    needs:
      - changes
      - native-fast-tests
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the built wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-python-artifacts-3.12
          path: dist

      - name: Restore the uv package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/uv
          key: ai-tests-uv-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('pyproject.toml') }}

      - name: Install the wheel and AI test dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --group ai-test dist/*.whl
          uv pip check

      - name: Verify the artifact-installed AI environment
        run: |
          site_packages="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          PYTHONSAFEPATH=1 PYTHONPATH="$site_packages:$GITHUB_WORKSPACE" python - <<'PY'
          import importlib.metadata
          import pathlib
          import sys

          import anthropic
          import google.genai
          import openai
          import typesafe_sdk
          import vane
          from vane import _native

          environment_root = pathlib.Path(sys.prefix).resolve()
          for package in (_native, vane):
              package_path = pathlib.Path(package.__file__).resolve()
              if not package_path.is_relative_to(environment_root):
                  raise RuntimeError(f"{package.__name__} was not imported from the wheel: {package_path}")
              print(f"{package.__name__}: {package_path}")
          for distribution_name in ("anthropic", "google-genai", "openai", "typesafe-sdk"):
              version = importlib.metadata.version(distribution_name)
              print(f"{distribution_name}: {version}")
          PY

      - name: Run non-Ray core AI tests
        run: |
          timeout --signal=INT --kill-after=30s 600s \
            scripts/run_ai_tests.sh core --junitxml="$RUNNER_TEMP/ai-core.xml"

      - name: Run non-Ray expression AI tests in a fresh process
        run: |
          timeout --signal=INT --kill-after=30s 600s \
            scripts/run_ai_tests.sh expressions --junitxml="$RUNNER_TEMP/ai-expressions.xml"

      - name: Run Ray AI tests in a fresh process
        run: |
          timeout --signal=INT --kill-after=30s 600s \
            scripts/run_ai_tests.sh ray --junitxml="$RUNNER_TEMP/ai-ray.xml"

      - name: Upload AI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-test-results
          path: ${{ runner.temp }}/ai-*.xml
          if-no-files-found: ignore

  # Keep this as the stable branch-protection check; matrix jobs may be skipped.
  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - changes
      - source-package
      - native-fast-tests
      - native-macos
      - native-windows
      - fast-tests
      - doris-tests
      - gravitino-tests
      - milvus-tests
      - qdrant-tests
      - ai-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Verify CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AI_TESTS_RESULT: ${{ needs.ai-tests.result }}
          FAST_TESTS_RESULT: ${{ needs.fast-tests.result }}
          DORIS_TESTS_RESULT: ${{ needs.doris-tests.result }}
          GRAVITINO_TESTS_RESULT: ${{ needs.gravitino-tests.result }}
          MILVUS_TESTS_RESULT: ${{ needs.milvus-tests.result }}
          QDRANT_TESTS_RESULT: ${{ needs.qdrant-tests.result }}
          RUN_FULL: ${{ needs.changes.outputs.run_full }}
          SOURCE_PACKAGE_RESULT: ${{ needs.source-package.result }}
          NATIVE_TESTS_RESULT: ${{ needs.native-fast-tests.result }}
          NATIVE_MACOS_RESULT: ${{ needs.native-macos.result }}
          NATIVE_WINDOWS_RESULT: ${{ needs.native-windows.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi

          case "$RUN_FULL" in
            true)
              expected_result=success
              ;;
            false)
              expected_result=skipped
              ;;
            *)
              echo "Unexpected full CI decision: $RUN_FULL" >&2
              exit 1
              ;;
          esac

          if [[ "$SOURCE_PACKAGE_RESULT" != "$expected_result" ||
                "$NATIVE_TESTS_RESULT" != "$expected_result" ||
                "$NATIVE_MACOS_RESULT" != "$expected_result" ||
                "$NATIVE_WINDOWS_RESULT" != "$expected_result" ||
                "$FAST_TESTS_RESULT" != "$expected_result" ||
                "$DORIS_TESTS_RESULT" != "$expected_result" ||
                "$GRAVITINO_TESTS_RESULT" != "$expected_result" ||
                "$MILVUS_TESTS_RESULT" != "$expected_result" ||
                "$QDRANT_TESTS_RESULT" != "$expected_result" ||
                "$AI_TESTS_RESULT" != "$expected_result" ]]; then
            echo "Unexpected CI results: source-package=$SOURCE_PACKAGE_RESULT, native-fast-tests=$NATIVE_TESTS_RESULT, native-macos=$NATIVE_MACOS_RESULT, native-windows=$NATIVE_WINDOWS_RESULT, fast-tests=$FAST_TESTS_RESULT, doris-tests=$DORIS_TESTS_RESULT, gravitino-tests=$GRAVITINO_TESTS_RESULT, milvus-tests=$MILVUS_TESTS_RESULT, qdrant-tests=$QDRANT_TESTS_RESULT, ai-tests=$AI_TESTS_RESULT" >&2
            exit 1
          fi

          echo "Required CI passed with full_ci=$RUN_FULL."
