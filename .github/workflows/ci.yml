name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      run_full: ${{ steps.ci_scope.outputs.run_full }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether full CI is required
        id: ci_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit
          fi

          if git diff --quiet --no-renames "$PR_BASE_SHA" "$PR_HEAD_SHA" --; then
            run_full=true
            echo "No changed files were detected; running full CI."
          elif git diff --quiet --no-renames "$PR_BASE_SHA" "$PR_HEAD_SHA" -- \
            . \
            ':(exclude,glob)**/*.md' \
            ':(exclude,glob).github/ISSUE_TEMPLATE/**' \
            ':(exclude,glob).github/PULL_REQUEST_TEMPLATE/**'; then
            run_full=false
            echo "Only Markdown or static GitHub templates changed; skipping package, native, fast-test, and AI-test CI."
          else
            run_full=true
            echo "A product, build, dependency, or automation file changed; running full CI."
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

  source-package:
    name: Source package (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and validate source package
        run: |
          python -m pip install --upgrade build packaging pip "tomli>=1.1; python_version < '3.11'"
          python -m build --sdist --outdir dist
          python scripts/check_release_artifacts.py dist/*.tar.gz

      - name: Apply private content rules to the source package
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        env:
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --content-rules-manifest - \
              dist/*.tar.gz

  native-fast-tests:
    name: Native build and fast tests (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-archives
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            libtool \
            nasm \
            ninja-build \
            openssl \
            pkg-config \
            tar \
            unzip \
            zip

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-binary-v1-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ hashFiles('vcpkg.json') }}

      - name: Install pinned native dependencies
        run: bash scripts/bootstrap_vcpkg.sh

      - name: Install optional native codec dependencies
        if: matrix.python-version == '3.12'
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet=x64-linux \
            --x-feature=native-image --x-feature=native-audio --x-feature=native-video

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            build \
            "cmake>=3.29" \
            "ninja>=1.10" \
            "pybind11[global]>=3.0.0" \
            "scikit-build-core>=0.11.4" \
            "setuptools-scm>=9.2.0" \
            mypy \
            packaging \
            "pydantic>=2" \
            pytest

      - name: Install signed extension wheel repair tooling
        if: matrix.python-version == '3.12'
        run: python -m pip install "auditwheel>=6.4" "patchelf>=0.17.2"

      - name: Build and run DuckDB unit tests
        if: matrix.python-version == '3.12'
        run: scripts/run_native_tests.sh

      - name: Sign the real-Ray dynamic extension fixture
        if: matrix.python-version == '3.12'
        run: |
          python scripts/sign_test_dynamic_extension.py \
            --private-key external/duckdb/test/mbedtls/private.pem \
            build/native-cxx20/test/extension/loadable_extension_demo.duckdb_extension \
            "$RUNNER_TEMP/test-dynamic-extension/loadable_extension_demo.duckdb_extension"

      - name: Build release artifacts
        env:
          SKBUILD_BUILD_DIR: ${{ github.workspace }}/build
          SKBUILD_CMAKE_BUILD_TYPE: Release
          CMAKE_ARGS: -DVANE_ENABLE_TEST_EXTENSION_SIGNING_KEY=${{ matrix.python-version == '3.12' && 'ON' || 'OFF' }} ${{ matrix.python-version == '3.12' && '-DVANE_LOADABLE_EXTENSIONS=image;audio;video' || '' }}
        run: python -m build --sdist --wheel --no-isolation --outdir dist

      - name: Validate release artifacts
        run: python scripts/check_release_artifacts.py dist/*.tar.gz dist/*.whl

      - name: Apply private content rules to release artifacts
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        env:
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --content-rules-manifest - \
              dist/*.tar.gz dist/*.whl

      - name: Install the built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Build and verify the signed test extension wheel
        if: matrix.python-version == '3.12'
        run: |
          shopt -s nullglob
          base_wheels=(dist/vane_ai-*.whl)
          test "${#base_wheels[@]}" -eq 1
          platform_tag="$(python -I -c 'from packaging.tags import sys_tags; print(next(tag.platform for tag in sys_tags() if tag.platform.startswith("manylinux_")))')"
          python -m auditwheel repair \
            --plat "$platform_tag" \
            --wheel-dir "$RUNNER_TEMP/test-base-wheels" \
            "${base_wheels[0]}"
          base_wheels=("$RUNNER_TEMP"/test-base-wheels/vane_ai-*.whl)
          test "${#base_wheels[@]}" -eq 1
          python -I scripts/build_extension_wheel.py \
            --artifact "$RUNNER_TEMP/test-dynamic-extension/loadable_extension_demo.duckdb_extension" \
            --extension-name loadable_extension_demo \
            --output-directory dist/extension-wheels \
            --platform-tag "$platform_tag" \
            --trust-identity vane-ci-test-key \
            --license-expression "Apache-2.0 AND MIT" \
            --license-file LICENSE \
            --license-file NOTICE \
            --license-file external/duckdb/LICENSE
          extension_wheels=(dist/extension-wheels/*.whl)
          test "${#extension_wheels[@]}" -eq 1
          python -I scripts/verify_extension_wheel.py \
            --base-wheel "${base_wheels[0]}" \
            --extension-wheel "${extension_wheels[0]}" \
            --extension-name loadable_extension_demo \
            --trust-identity vane-ci-test-key

      - name: Apply private content rules to the signed test extension wheel
        if: >-
          matrix.python-version == '3.12' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        env:
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          shopt -s nullglob
          extension_wheels=(dist/extension-wheels/*.whl)
          test "${#extension_wheels[@]}" -eq 1
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --scan-contents-only \
              --content-rules-manifest - \
              "${extension_wheels[0]}"

      - name: Exercise native image, audio, and video extensions
        if: matrix.python-version == '3.12'
        env:
          VANE_TEST_NATIVE_IMAGE_EXTENSION: ${{ github.workspace }}/build/vane_extensions/image.duckdb_extension
          VANE_TEST_NATIVE_AUDIO_EXTENSION: ${{ github.workspace }}/build/vane_extensions/audio.duckdb_extension
          VANE_TEST_NATIVE_VIDEO_EXTENSION: ${{ github.workspace }}/build/vane_extensions/video.duckdb_extension
          VANE_TEST_NATIVE_MEDIA_PROVIDERS: "1"
        run: |
          python -m pip install "av>=17.1,<18" "pillow>=11" "psutil>=5.9" "soundfile>=0.14" "soxr>=1,<2"
          cmake --build build --target vane_loadable_extensions --parallel 2
          platform_tag="$(python -I -c 'from packaging.tags import sys_tags; print(next(tag.platform for tag in sys_tags() if tag.platform.startswith("manylinux_")))')"
          python scripts/sync_vcpkg_licenses.py \
            --output "$RUNNER_TEMP/native-extension-notices.txt"
          for domain in image audio video; do
            python scripts/sign_test_dynamic_extension.py \
              --private-key external/duckdb/test/mbedtls/private.pem \
              "build/vane_extensions/$domain.duckdb_extension" \
              "$RUNNER_TEMP/native-media/$domain.duckdb_extension"
            python -I scripts/build_extension_wheel.py \
              --artifact "$RUNNER_TEMP/native-media/$domain.duckdb_extension" \
              --extension-name "$domain" \
              --output-directory "$RUNNER_TEMP/native-media/wheels" \
              --platform-tag "$platform_tag" \
              --trust-identity vane-ci-test-key \
              --license-expression "Apache-2.0 AND MIT AND LGPL-2.1-or-later AND Zlib" \
              --license-file LICENSE --license-file NOTICE \
              --license-file external/duckdb/LICENSE \
              --license-file "$RUNNER_TEMP/native-extension-notices.txt"
          done
          python -m pip install "$RUNNER_TEMP"/native-media/wheels/*.whl
          scripts/run_installed_pytest.sh tests/fast/test_native_media_extensions.py tests/fast/test_read_video_frames.py tests/fast/test_fixed_shape_image.py tests/fast/test_video_expressions.py
          scripts/run_installed_pytest.sh tests/fast/test_ray_native_media_extensions.py tests/fast/test_ray_read_video_frames.py tests/fast/test_ray_video_expressions.py

      - name: Verify the installed native namespace typing contract
        if: matrix.python-version == '3.10'
        run: |
          cp \
            "$GITHUB_WORKSPACE/tests/typing/native_namespace.py" \
            "$GITHUB_WORKSPACE/tests/typing/expression_udf_actor_number.py" \
            "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH -u MYPYPATH python -I -m mypy \
            --config-file "$GITHUB_WORKSPACE/tests/typing/installed_mypy.ini" \
            --no-incremental \
            --python-version 3.10 \
            --strict \
            --disallow-any-expr \
            native_namespace.py \
            expression_udf_actor_number.py

      - name: Verify the base installation is importable by mypy
        if: matrix.python-version == '3.10'
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH -u MYPYPATH python -I -m mypy \
            --config-file "$GITHUB_WORKSPACE/tests/typing/base_import_mypy.ini" \
            --no-incremental \
            -c 'import vane'

      - name: Verify the installed AI typing contract
        if: matrix.python-version == '3.10'
        run: |
          cp \
            "$GITHUB_WORKSPACE/tests/typing/ai_prompt.py" \
            "$GITHUB_WORKSPACE/tests/typing/ai_embed.py" \
            "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH -u MYPYPATH python -I -m mypy \
            --config-file "$GITHUB_WORKSPACE/tests/typing/ai_mypy.ini" \
            ai_prompt.py \
            ai_embed.py

      - name: Verify the base installation Quickstart outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          env -u VANE_RUNNER python "$GITHUB_WORKSPACE/scripts/verify_base_install.py"

      - name: Run the base-installation release tests
        # This normally takes under a minute. Bound a stuck pytest/Ray teardown
        # and signal its whole process group so it cannot block the fast-test
        # jobs that consume the Python 3.12 artifact.
        timeout-minutes: 12
        run: timeout --signal=INT --kill-after=30s 600s scripts/run_release_tests.sh

      - name: Verify coexistence with the official DuckDB distribution
        if: matrix.python-version == '3.12'
        run: python scripts/verify_duckdb_coexistence.py dist/*.whl

      - name: Upload validated artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-python-artifacts-${{ matrix.python-version }}
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/extension-wheels/*.whl
          if-no-files-found: error

  fast-tests:
    name: Fast tests (${{ matrix.label }})
    needs:
      - changes
      - native-fast-tests
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: non-Ray 1/2
            phase: non-ray
            shard_index: 0
            shard_count: 2
            process_timeout: 1800
          - label: non-Ray 2/2
            phase: non-ray
            shard_index: 1
            shard_count: 2
            process_timeout: 1800
          - label: shared Ray
            phase: shared-ray
            shard_index: 0
            shard_count: 1
            process_timeout: 1800
          - label: isolated Ray owners
            phase: owner-ray
            shard_index: 0
            shard_count: 1
            process_timeout: 900
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      VANE_FAST_TEST_EXCLUDE_GPU: "1"
      VANE_FAST_TEST_JUNIT_DIR: ${{ github.workspace }}/test-results
      VANE_FAST_TEST_NON_RAY_SHARD_COUNT: ${{ matrix.shard_count }}
      VANE_FAST_TEST_NON_RAY_SHARD_INDEX: ${{ matrix.shard_index }}
      VANE_FAST_TEST_PROCESS_TIMEOUT_SECONDS: ${{ matrix.process_timeout }}
      VANE_REQUIRE_PACKAGED_DYNAMIC_EXTENSION_PROVIDER: "1"
      VANE_REQUIRE_SIGNED_DYNAMIC_EXTENSION_FIXTURE: "1"
      VANE_TEST_SIGNED_DYNAMIC_EXTENSION_NAME: loadable_extension_demo
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the built wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-python-artifacts-3.12
          path: dist

      - name: Restore the uv package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/uv
          key: fast-tests-uv-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('pyproject.toml') }}

      - name: Install the wheel and CPU test dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --group build --group test duckdb \
            dist/*.whl dist/extension-wheels/*.whl
          uv pip check

      - name: Verify the artifact-installed CPU environment
        run: |
          site_packages="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          PYTHONSAFEPATH=1 PYTHONPATH="$site_packages:$GITHUB_WORKSPACE" python - <<'PY'
          import importlib.metadata
          import pathlib
          import sys

          import _duckdb as official_native
          import duckdb
          import torch
          import vane
          from vane import _native

          distribution = importlib.metadata.distribution("vane-ai")
          extension_path = pathlib.Path(_native.__file__).resolve()
          official_extension_path = pathlib.Path(official_native.__file__).resolve()
          environment_root = pathlib.Path(sys.prefix).resolve()
          if not extension_path.is_relative_to(environment_root):
              raise RuntimeError(f"vane._native was not installed from the wheel: {extension_path}")
          if extension_path == official_extension_path:
              raise RuntimeError("Vane and DuckDB resolved to the same native extension")
          for package in (duckdb, vane):
              package_path = pathlib.Path(package.__file__).resolve()
              if not package_path.is_relative_to(environment_root):
                  raise RuntimeError(f"{package.__name__} was not imported from the wheel: {package_path}")
              print(f"{package.__name__} package: {package_path}")
          if torch.version.cuda is not None or torch.cuda.is_available():
              raise RuntimeError("fast-test jobs must use the CPU-only PyTorch build")
          print(f"installed {distribution.metadata['Name']} {distribution.version}")
          print(f"Vane native extension: {extension_path}")
          print(f"DuckDB native extension: {official_extension_path}")
          print(f"Vane query: {vane.connect().execute('SELECT 42').fetchone()}")
          print(f"DuckDB query: {duckdb.connect().execute('SELECT 43').fetchone()}")
          print(f"PyTorch {torch.__version__}; CUDA unavailable as expected")
          PY

      - name: Run ${{ matrix.label }} fast-test shard
        env:
          FAST_TEST_PHASE: ${{ matrix.phase }}
        run: |
          if [[ "$FAST_TEST_PHASE" == "owner-ray" ]]; then
            # This runner is dedicated to one shard, so Ray daemon cleanup can
            # happen outside pytest without risking an unrelated local cluster.
            export VANE_FAST_TEST_EXTERNAL_RAY_CLEANUP=1
          fi
          scripts/run_fast_tests.sh "$FAST_TEST_PHASE"

      - name: Stop residual Ray processes
        if: ${{ always() && matrix.phase != 'non-ray' }}
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=10s 30s ray stop --force

      - name: Publish the JUnit summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          FAST_TEST_LABEL: ${{ matrix.label }}
        run: |
          python scripts/summarize_junit.py \
            --label "$FAST_TEST_LABEL" \
            "$VANE_FAST_TEST_JUNIT_DIR" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-test-results-${{ matrix.phase }}-${{ matrix.shard_index }}
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

  milvus-tests:
    name: Milvus integration test
    needs:
      - changes
      - native-fast-tests
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      VANE_TEST_MILVUS_URI: http://127.0.0.1:19530
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the built wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-python-artifacts-3.12
          path: dist

      - name: Install the wheel and Milvus test dependencies
        run: |
          python -m pip install --upgrade pip
          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m pip install --force-reinstall "${wheel_path}[milvus]" pytest
          python -m pip check
          python -c 'import pymilvus'

      - name: Start Milvus standalone
        run: |
          milvus_runtime="$RUNNER_TEMP/vane-milvus"
          mkdir -p "$milvus_runtime"
          printf '%s\n' \
            'listen-client-urls: http://0.0.0.0:2379' \
            'advertise-client-urls: http://0.0.0.0:2379' \
            'quota-backend-bytes: 4294967296' \
            'auto-compaction-mode: revision' \
            "auto-compaction-retention: '1000'" \
            > "$milvus_runtime/embedEtcd.yaml"
          printf '%s\n' '# Extra config to override default milvus.yaml' \
            > "$milvus_runtime/user.yaml"
          docker run --detach \
            --name vane-milvus \
            --security-opt seccomp=unconfined \
            --env ETCD_USE_EMBED=true \
            --env ETCD_DATA_DIR=/var/lib/milvus/etcd \
            --env ETCD_CONFIG_PATH=/milvus/configs/embedEtcd.yaml \
            --env COMMON_STORAGETYPE=local \
            --env DEPLOY_MODE=STANDALONE \
            --mount "type=bind,source=$milvus_runtime/embedEtcd.yaml,target=/milvus/configs/embedEtcd.yaml,readonly" \
            --mount "type=bind,source=$milvus_runtime/user.yaml,target=/milvus/configs/user.yaml,readonly" \
            --publish 127.0.0.1:19530:19530 \
            --publish 127.0.0.1:9091:9091 \
            milvusdb/milvus:v3.0.0@sha256:49371c30af46b1013e4d3e0b980e691d81376d69cdbe1b372725baf1d7255862 \
            milvus run standalone

      - name: Wait for Milvus to become healthy
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:9091/healthz > /dev/null; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' vane-milvus)" != "running" ]]; then
              echo "Milvus stopped before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Milvus did not become healthy within 180 seconds" >&2
          exit 1

      - name: Run the live Milvus sink test
        run: |
          timeout --signal=INT --kill-after=30s 300s \
            scripts/run_installed_pytest.sh \
              -o addopts= \
              -m external_service \
              tests/fast/test_milvus_datasink.py

      - name: Print Milvus logs on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: docker logs vane-milvus

      - name: Stop Milvus
        if: ${{ always() }}
        continue-on-error: true
        run: docker rm --force vane-milvus

  qdrant-tests:
    name: Qdrant integration test
    needs:
      - changes
      - native-fast-tests
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      VANE_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the built wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-python-artifacts-3.12
          path: dist

      - name: Install the wheel and Qdrant test dependencies
        run: |
          python -m pip install --upgrade pip
          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m pip install --force-reinstall "${wheel_path}[qdrant]" pytest
          python -m pip check
          python -c 'import qdrant_client'

      - name: Start Qdrant
        run: |
          docker run --detach \
            --name vane-qdrant \
            --publish 127.0.0.1:6333:6333 \
            qdrant/qdrant:v1.19.0@sha256:6c0652f8d6925b22f2f6f0e0a5365a6c9dbc8768bd6e70ccc1cdc14847e452a0

      - name: Wait for Qdrant to become healthy
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:6333/healthz > /dev/null; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Status}}' vane-qdrant)" != "running" ]]; then
              echo "Qdrant stopped before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Qdrant did not become healthy within 120 seconds" >&2
          exit 1

      - name: Run the live Qdrant sink test
        run: |
          timeout --signal=INT --kill-after=30s 300s \
            scripts/run_installed_pytest.sh \
              -o addopts= \
              -m external_service \
              tests/fast/test_qdrant_datasink.py

      - name: Print Qdrant logs on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: docker logs vane-qdrant

      - name: Stop Qdrant
        if: ${{ always() }}
        continue-on-error: true
        run: docker rm --force vane-qdrant

  ai-tests:
    name: AI tests
    needs:
      - changes
      - native-fast-tests
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the built wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-python-artifacts-3.12
          path: dist

      - name: Restore the uv package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/uv
          key: ai-tests-uv-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('pyproject.toml') }}

      - name: Install the wheel and AI test dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --group ai-test dist/*.whl
          uv pip check

      - name: Verify the artifact-installed AI environment
        run: |
          site_packages="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          PYTHONSAFEPATH=1 PYTHONPATH="$site_packages:$GITHUB_WORKSPACE" python - <<'PY'
          import importlib.metadata
          import pathlib
          import sys

          import anthropic
          import google.genai
          import openai
          import vane
          from vane import _native

          environment_root = pathlib.Path(sys.prefix).resolve()
          for package in (_native, vane):
              package_path = pathlib.Path(package.__file__).resolve()
              if not package_path.is_relative_to(environment_root):
                  raise RuntimeError(f"{package.__name__} was not imported from the wheel: {package_path}")
              print(f"{package.__name__}: {package_path}")
          for distribution_name in ("anthropic", "google-genai", "openai"):
              version = importlib.metadata.version(distribution_name)
              print(f"{distribution_name}: {version}")
          PY

      - name: Run AI tests
        run: |
          site_packages="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          cd "$RUNNER_TEMP"
          PYTHONSAFEPATH=1 PYTHONPATH="$site_packages:$GITHUB_WORKSPACE" \
            timeout --signal=INT --kill-after=30s 600s \
            python -m pytest --import-mode=importlib --quiet "$GITHUB_WORKSPACE/tests/ai"

  # Keep this as the stable branch-protection check; matrix jobs may be skipped.
  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - changes
      - source-package
      - native-fast-tests
      - fast-tests
      - milvus-tests
      - qdrant-tests
      - ai-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Verify CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AI_TESTS_RESULT: ${{ needs.ai-tests.result }}
          FAST_TESTS_RESULT: ${{ needs.fast-tests.result }}
          MILVUS_TESTS_RESULT: ${{ needs.milvus-tests.result }}
          QDRANT_TESTS_RESULT: ${{ needs.qdrant-tests.result }}
          RUN_FULL: ${{ needs.changes.outputs.run_full }}
          SOURCE_PACKAGE_RESULT: ${{ needs.source-package.result }}
          NATIVE_TESTS_RESULT: ${{ needs.native-fast-tests.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi

          case "$RUN_FULL" in
            true)
              expected_result=success
              ;;
            false)
              expected_result=skipped
              ;;
            *)
              echo "Unexpected full CI decision: $RUN_FULL" >&2
              exit 1
              ;;
          esac

          if [[ "$SOURCE_PACKAGE_RESULT" != "$expected_result" ||
                "$NATIVE_TESTS_RESULT" != "$expected_result" ||
                "$FAST_TESTS_RESULT" != "$expected_result" ||
                "$MILVUS_TESTS_RESULT" != "$expected_result" ||
                "$QDRANT_TESTS_RESULT" != "$expected_result" ||
                "$AI_TESTS_RESULT" != "$expected_result" ]]; then
            echo "Unexpected CI results: source-package=$SOURCE_PACKAGE_RESULT, native-fast-tests=$NATIVE_TESTS_RESULT, fast-tests=$FAST_TESTS_RESULT, milvus-tests=$MILVUS_TESTS_RESULT, qdrant-tests=$QDRANT_TESTS_RESULT, ai-tests=$AI_TESTS_RESULT" >&2
            exit 1
          fi

          echo "Required CI passed with full_ci=$RUN_FULL."
