name: VaneFS

on:
  pull_request:
    paths:
      - "vane_fs/**"
      - ".github/workflows/vane-fs.yml"
  push:
    branches: [main]
    paths:
      - "vane_fs/**"
      - ".github/workflows/vane-fs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vane-fs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-mounted-filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-archives
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/vane_fs/vcpkg_installed/x64-linux-release
      VANE_FS_MOUNT_BINARY: ${{ github.workspace }}/vane_fs/build/core/vane-fs-mount
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build and mount dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libfuse3-dev fuse3 curl zip unzip tar
          sudo modprobe fuse
          sudo chmod a+rw /dev/fuse
          python -m pip install 'cmake>=3.29' 'scikit-build-core>=0.11.4' 'pybind11>=3' build 'pytest>=8.2' 'pytest-timeout>=2.3' fsspec
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/vcpkg-archives
          key: vane-fs-sqlite-${{ runner.os }}-${{ hashFiles('vane_fs/vcpkg.json') }}
      - name: Build the pinned SQLite dependency
        run: |
          baseline="$(python -c 'import json; print(json.load(open("vane_fs/vcpkg.json"))["builtin-baseline"])')"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach "$baseline"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$PWD/vane_fs" --x-install-root="$PWD/vane_fs/vcpkg_installed" \
            --triplet=x64-linux-release --host-triplet=x64-linux-release \
            --clean-buildtrees-after-build --clean-packages-after-build
          python -I scripts/check_copyleft.py
      - name: Build and test the C++ core and mount executable
        run: |
          cmake -S vane_fs -B vane_fs/build/core -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVANE_FS_BUILD_PYTHON=OFF -DVANE_FS_BUILD_TESTS=ON \
            -DVANE_FS_BUILD_TOOLS=ON -DVANE_FS_BUILD_FUSE=ON
          cmake --build vane_fs/build/core -j 2
          ctest --test-dir vane_fs/build/core --output-on-failure
      - name: Build a wheel from the source archive and install it
        working-directory: vane_fs
        env:
          SKBUILD_BUILD_DIR: ${{ github.workspace }}/vane_fs/build/python-release
          SKBUILD_CMAKE_BUILD_TYPE: Release
        run: |
          python -m build --no-isolation --outdir build/dist
          python - <<'PY'
          import pathlib, tarfile
          archive = next(pathlib.Path("build/dist").glob("*.tar.gz"))
          with tarfile.open(archive) as source:
              names = source.getnames()
          excluded = {"build", "vcpkg_installed", ".venv", ".cache", "__pycache__"}
          assert not any(excluded.intersection(pathlib.PurePosixPath(name).parts) for name in names), names
          required = {"src/owner_lock.hpp", "src/fuse.cpp", "tests/test_crash.cpp", "benchmarks/run.py"}
          prefix = archive.name.removesuffix(".tar.gz")
          assert all(f"{prefix}/{name}" in names for name in required), names
          PY
          python -m pip install --no-deps build/dist/*.whl
      - name: Test installed bindings, recovery, and real FUSE mounts
        run: |
          project_root="$PWD"
          cd "$(mktemp -d)"
          python -m pytest -c "$project_root/vane_fs/pyproject.toml" \
            --rootdir="$project_root/vane_fs" --import-mode=importlib \
            "$project_root/vane_fs/tests" --junitxml="$project_root/vane_fs/build/tests.xml"
      - name: Check native memory safety
        run: |
          cmake -S vane_fs -B vane_fs/build/sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DVANE_FS_BUILD_PYTHON=OFF -DVANE_FS_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build vane_fs/build/sanitize -j 2
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir vane_fs/build/sanitize --output-on-failure
      - name: Verify benchmark validation and cleanup
        run: |
          python vane_fs/benchmarks/run.py --binary vane_fs/build/core/vane-fs-benchmark \
            --output vane_fs/build/benchmark-smoke --quick --repeat 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vane-fs-validation
          path: |
            vane_fs/build/tests.xml
            vane_fs/build/core/Testing/Temporary/LastTest.log
            vane_fs/build/sanitize/Testing/Temporary/LastTest.log
            vane_fs/build/benchmark-smoke/*.json
            vane_fs/build/benchmark-smoke/*.log
