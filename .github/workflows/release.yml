name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build only, publish a main-branch dev candidate, or publish an existing draft release
        type: choice
        options:
          - build-only
          - testpypi-dev
          - release
        default: build-only
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-package:
    name: Build source package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package_version.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install --upgrade build packaging pip

      - name: Validate the release request
        if: inputs.operation == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          release_version="$(python - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys

          from packaging.version import InvalidVersion, Version

          raw_version = sys.argv[1]
          try:
              version = Version(raw_version)
          except InvalidVersion:
              raise SystemExit(f"release tag does not contain a valid PEP 440 version: {raw_version!r}") from None
          if str(version) != raw_version:
              raise SystemExit(f"release tag must use canonical PEP 440 spelling: v{version}")
          if version.epoch != 0 or len(version.release) != 3:
              raise SystemExit("release tags must use an X.Y.Z version without an epoch")
          if version.is_devrelease or version.local is not None:
              raise SystemExit("release tags cannot use development or local versions")
          print(version)
          PY
          )"
          test "$GITHUB_REF_NAME" = "v$release_version"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VANE_AI=$release_version" >> "$GITHUB_ENV"

          release_commit="$(git rev-parse HEAD^{commit})"
          release_branch="$(python - "$release_version" <<'PY'
          import sys
          from packaging.version import Version

          version = Version(sys.argv[1])
          major, minor, patch = version.release
          if patch == 0 and version.post is None:
              print("main")
          else:
              print(f"release/{major}.{minor}")
          PY
          )"
          release_ref="refs/remotes/origin/$release_branch"
          git fetch --no-tags origin "refs/heads/$release_branch:$release_ref"
          git merge-base --is-ancestor "$release_commit" "$release_ref" || {
            echo "v$release_version must be reachable from $release_branch" >&2
            exit 1
          }

          release_id="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq --slurp --raw-output --arg tag "$GITHUB_REF_NAME" '
                [
                  .[][]
                  | select(
                      .tag_name == $tag
                      and .draft
                      and ((.body // "") | length > 0)
                    )
                  | .id
                ]
                | if length == 1 then .[0] else empty end
              '
          )"
          test -n "$release_id"

          python - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          version = urllib.parse.quote(sys.argv[1], safe="")
          for index in ("https://test.pypi.org", "https://pypi.org"):
              url = f"{index}/pypi/vane-ai/{version}/json"
              try:
                  with urllib.request.urlopen(url, timeout=30):
                      pass
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      continue
                  raise
              raise SystemExit(f"vane-ai {sys.argv[1]} already exists on {index}")
          PY

      - name: Build the source package
        run: |
          python -m build --sdist --outdir dist

      - name: Record and validate the package version
        id: package_version
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          path="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$path"
          version="$(python - "$path" <<'PY'
          import sys
          from pathlib import Path

          from packaging.utils import parse_sdist_filename

          _, version = parse_sdist_filename(Path(sys.argv[1]).name)
          print(version)
          PY
          )"
          if test "$OPERATION" = "release"; then
            test "$GITHUB_REF_NAME" = "v$version"
          elif test "$OPERATION" = "testpypi-dev"; then
            python scripts/validate_testpypi_candidate.py \
              --version "$version" \
              --github-ref "$GITHUB_REF"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python scripts/check_release_artifacts.py --expected-version "$version" "$path"

      - name: Apply private content rules to the source package
        if: ${{ inputs.operation == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
        env:
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --content-rules-manifest - \
              --expected-version "${{ steps.package_version.outputs.version }}" \
              dist/*.tar.gz

      - name: Upload source package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  linux-vcpkg:
    name: Prepare Linux vcpkg dependencies
    needs: source-package
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      # Keep in sync with pyproject.toml's manylinux-x86_64-image; the guard
      # step below fails when either drifts from what cibuildwheel resolves.
      VANE_MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:012f4a50472412f18bb2b450c1cce7158434cfae4ae878591c2748a13a30c2be
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the pinned manylinux image
        run: |
          python -m pip install --quiet "cibuildwheel==4.2.0"
          python - <<'PY'
          import configparser
          import os
          import pathlib
          import tomllib

          import cibuildwheel

          resources = pathlib.Path(cibuildwheel.__file__).parent / "resources"
          parser = configparser.ConfigParser()
          parser.read(resources / "pinned_docker_images.cfg")
          resolved = parser["x86_64"]["manylinux_2_28"].split("#")[0].strip()

          project = tomllib.load(open("pyproject.toml", "rb"))
          pinned = project["tool"]["cibuildwheel"]["linux"]["manylinux-x86_64-image"]

          expected = os.environ["VANE_MANYLINUX_IMAGE"]
          assert resolved == expected, f"cibuildwheel resolves {resolved}, workflow pins {expected}"
          assert pinned == expected, f"pyproject pins {pinned}, workflow pins {expected}"
          print(f"manylinux image verified: {resolved}")
          PY

      - name: Download the exact source package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-sdist
          path: dist

      - name: Extract the exact source package
        id: package
        run: |
          tarball="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$tarball"
          rm -rf package
          mkdir -p package
          tar --extract --gzip --file "$tarball" --directory package --strip-components=1
          test -f package/pyproject.toml
          echo "path=package" >> "$GITHUB_OUTPUT"

      # The manylinux image digest is pinned above, so a tree built by a
      # previous run stays valid; caching the tree lets a warm run skip the
      # container bootstrap entirely.
      # exact key only: a prefix restore could hand back a tree built for an
      # older vcpkg.json, and the bootstrap guard cannot tell that apart from a
      # current one, so a manifest change must rebuild the tree.
      - name: Restore the vcpkg install tree
        id: tree
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: package/vcpkg_installed
          key: vcpkg-tree-linux-cibuildwheel-4.2.0-${{ hashFiles('vcpkg.json') }}

      - name: Install the pinned vcpkg dependencies
        run: |
          if [ -f package/vcpkg_installed/x64-linux-release/share/arrow/ArrowConfig.cmake ]; then
            echo "reusing the cached vcpkg install tree"
            exit 0
          fi
          # vcpkg downloads its own binary and package archives; a transient CDN
          # error should not fail the whole release.
          bootstrapped=0
          for attempt in 1 2 3; do
            if docker run --rm \
              -v "$PWD/package:/package" \
              -w /package \
              -e VCPKG_ROOT=/package/.cache/vcpkg \
              -e VCPKG_DEFAULT_BINARY_CACHE=/package/.cache/vcpkg-archives \
              "$VANE_MANYLINUX_IMAGE" \
              bash -lc '
                set -euo pipefail
                yum install -y autoconf automake bison ccache curl flex git libtool make perl pkgconfig tar unzip which zip
                bash scripts/bootstrap_manylinux_bison.sh
                bash scripts/bootstrap_vcpkg.sh /package
              '; then
              bootstrapped=1
              break
            fi
            echo "bootstrap attempt ${attempt} failed; retrying" >&2
            sleep 30
          done
          test "$bootstrapped" = 1
          test -f package/vcpkg_installed/x64-linux-release/share/arrow/ArrowConfig.cmake
          # The container writes as root; hand the tree back for the cache save
          # and the artifact upload.
          sudo chown -R "$(id -u):$(id -g)" package/vcpkg_installed

      - name: Save the vcpkg install tree
        if: steps.tree.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: package/vcpkg_installed
          key: vcpkg-tree-linux-cibuildwheel-4.2.0-${{ hashFiles('vcpkg.json') }}

      - name: Upload the vcpkg install tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-vcpkg-installed
          path: package/vcpkg_installed
          if-no-files-found: error
          retention-days: 7

  wheels-linux:
    name: Build manylinux wheels (cp${{ matrix.minor }})
    needs: [source-package, linux-vcpkg]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - minor: "310"
          - minor: "311"
          - minor: "312"
          - minor: "313"
          - minor: "314"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --upgrade packaging

      - name: Download the exact source package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-sdist
          path: dist

      - name: Extract the exact source package
        id: package
        run: |
          tarball="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$tarball"
          rm -rf package
          mkdir -p package
          tar --extract --gzip --file "$tarball" --directory package --strip-components=1
          test -f package/pyproject.toml
          echo "path=package" >> "$GITHUB_OUTPUT"

      - name: Download the vcpkg install tree
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-vcpkg-installed
          path: package/vcpkg_installed

      - name: Configure the dependency bootstrap
        run: |
          yum="yum install -y autoconf automake bison ccache curl flex git libtool make perl pkgconfig tar unzip which zip"
          echo "CIBW_BEFORE_ALL=$yum" >> "$GITHUB_ENV"

      - name: Build the cp${{ matrix.minor }} wheel from the source package
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_BUILD: cp${{ matrix.minor }}-manylinux_x86_64
          CIBW_CONFIG_SETTINGS: "cmake.define.VANE_ENABLE_TESTPYPI_EXTENSION_SIGNING_KEY=${{ inputs.operation == 'testpypi-dev' && 'ON' || 'OFF' }}"
        with:
          package-dir: ${{ steps.package.outputs.path }}
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"

      - name: Validate the wheel
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
        run: |
          test "$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          python scripts/check_release_artifacts.py --expected-version "$EXPECTED_VERSION" wheelhouse/*.whl

      - name: Verify the final CPython 3.12 wheel coexists with DuckDB
        if: matrix.minor == '312'
        run: |
          wheel="$(find wheelhouse -maxdepth 1 -type f -name '*-cp312-cp312-*.whl' -print)"
          test -n "$wheel"
          test "$(printf '%s\n' "$wheel" | wc -l)" -eq 1
          python scripts/verify_duckdb_coexistence.py "$wheel"

      - name: Apply private content rules to the wheel
        if: ${{ inputs.operation == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --content-rules-manifest - \
              --expected-version "$EXPECTED_VERSION" \
              wheelhouse/*.whl

      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheels-linux-cp${{ matrix.minor }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  macos-vcpkg:
    name: Prepare macOS vcpkg dependencies
    needs: source-package
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-archives
      VCPKG_TARGET_TRIPLET: arm64-osx-release
      VCPKG_HOST_TRIPLET: arm64-osx-release
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install macOS build tools
        run: |
          brew install bison ccache coreutils ninja
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The tree stays valid as long as the compiler that built it is the same,
      # so key on the Apple clang version rather than on the runner image: the
      # image label changes between runner pools while the toolchain does not.
      - name: Record the Apple clang version
        id: toolchain
        run: |
          version="$(clang --version | head -n 1)"
          digest="$(python -c 'import hashlib,sys; print(hashlib.sha256(sys.argv[1].encode()).hexdigest()[:16])' "$version")"
          echo "version=$digest" >> "$GITHUB_OUTPUT"
          echo "Apple clang: $version ($digest)"

      - name: Download the exact source package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-sdist
          path: dist

      - name: Extract the exact source package
        id: package
        run: |
          tarball="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$tarball"
          rm -rf package
          mkdir -p package
          tar --extract --gzip --file "$tarball" --directory package --strip-components=1
          test -f package/pyproject.toml
          echo "path=package" >> "$GITHUB_OUTPUT"

      # exact key only: a prefix restore could hand back a tree built for an
      # older vcpkg.json, and the bootstrap guard cannot tell that apart from a
      # current one, so a manifest change must rebuild the tree.
      - name: Restore the vcpkg install tree
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: package/vcpkg_installed
          key: vcpkg-tree-${{ runner.os }}-clang-${{ steps.toolchain.outputs.version }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg when the tree cache missed
        id: bootstrap
        run: |
          if [ -f package/vcpkg_installed/arm64-osx-release/share/arrow/ArrowConfig.cmake ]; then
            echo "reusing the cached vcpkg install tree"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # vcpkg downloads its own binary and package archives; a transient CDN
          # error should not fail the whole release.
          for attempt in 1 2 3; do
            if bash package/scripts/bootstrap_vcpkg.sh package; then
              echo "reused=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "bootstrap attempt ${attempt} failed; retrying" >&2
            sleep 30
          done
          echo "bootstrap failed after 3 attempts" >&2
          exit 1

      - name: Save the vcpkg install tree
        if: steps.bootstrap.outputs.reused == 'false'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: package/vcpkg_installed
          key: vcpkg-tree-${{ runner.os }}-clang-${{ steps.toolchain.outputs.version }}-${{ hashFiles('vcpkg.json') }}

      - name: Upload the vcpkg install tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-vcpkg-installed
          path: package/vcpkg_installed
          if-no-files-found: error
          retention-days: 7

  wheels-macos:
    name: Build macOS arm64 wheels (cp${{ matrix.minor }})
    needs: [source-package, macos-vcpkg]
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - minor: "310"
          - minor: "311"
          - minor: "312"
          - minor: "313"
          - minor: "314"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the exact source package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-sdist
          path: dist

      - name: Extract the exact source package
        id: package
        run: |
          tarball="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$tarball"
          rm -rf package
          mkdir -p package
          tar --extract --gzip --file "$tarball" --directory package --strip-components=1
          test -f package/pyproject.toml
          echo "path=package" >> "$GITHUB_OUTPUT"

      - name: Download the vcpkg install tree
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-vcpkg-installed
          path: package/vcpkg_installed

      - name: Install release validation tooling
        run: python -m pip install --upgrade packaging

      - name: Build the cp${{ matrix.minor }} wheel from the source package
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_BUILD: cp${{ matrix.minor }}-macosx_arm64
          CIBW_CONFIG_SETTINGS: "cmake.define.VANE_ENABLE_TESTPYPI_EXTENSION_SIGNING_KEY=${{ inputs.operation == 'testpypi-dev' && 'ON' || 'OFF' }}"
        with:
          package-dir: ${{ steps.package.outputs.path }}
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"
          # The uv build frontend needs a uv binary on PATH; host runners do
          # not provide one, so let the action install and expose it.
          extras: uv

      - name: Validate the wheel
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
        run: |
          test "$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          python scripts/check_release_artifacts.py --expected-version "$EXPECTED_VERSION" wheelhouse/*.whl

      - name: Verify the final CPython 3.12 wheel coexists with DuckDB
        if: matrix.minor == '312'
        run: |
          wheel="$(find wheelhouse -maxdepth 1 -type f -name '*-cp312-cp312-macosx_*_arm64.whl' -print)"
          test -n "$wheel"
          test "$(printf '%s\n' "$wheel" | wc -l)" -eq 1
          python scripts/verify_duckdb_coexistence.py "$wheel"

      - name: Apply private content rules to the wheel
        if: ${{ inputs.operation == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --content-rules-manifest - \
              --expected-version "$EXPECTED_VERSION" \
              wheelhouse/*.whl

      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheels-macos-cp${{ matrix.minor }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  windows-vcpkg:
    name: Prepare Windows vcpkg dependencies
    needs: source-package
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-archives
      VCPKG_TARGET_TRIPLET: x64-windows-static-release
      VCPKG_HOST_TRIPLET: x64-windows-static-release
    steps:
      - name: Preserve source bytes on Windows checkout
        run: git config --global core.autocrlf false

      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The tree stays valid as long as the compiler that built it is the same,
      # so key on the MSVC toolset version rather than on the runner image: the
      # image label changes between runner pools while the toolset does not.
      - name: Record the MSVC toolset version
        id: toolchain
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          version="$("$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion | tr -d '\r')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSVC toolset: $version"

      - name: Download the exact source package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-sdist
          path: dist

      - name: Extract the exact source package
        id: package
        run: |
          tarball="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$tarball"
          rm -rf package
          mkdir -p package
          tar --extract --gzip --file "$tarball" --directory package --strip-components=1
          test -f package/pyproject.toml
          echo "path=package" >> "$GITHUB_OUTPUT"

      # vcpkg's per-package binary cache cannot survive a toolset change, so
      # cache the finished install tree instead and skip the bootstrap when it
      # is there.
      # exact key only: a prefix restore could hand back a tree built for an
      # older vcpkg.json, and the bootstrap guard cannot tell that apart from a
      # current one, so a manifest change must rebuild the tree.
      - name: Restore the vcpkg install tree
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: package/vcpkg_installed
          key: vcpkg-tree-${{ runner.os }}-msvc-${{ steps.toolchain.outputs.version }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg when the tree cache missed
        id: bootstrap
        run: |
          if [ -f package/vcpkg_installed/x64-windows-static-release/share/arrow/ArrowConfig.cmake ]; then
            echo "reusing the cached vcpkg install tree"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # vcpkg downloads its own binary and package archives; a transient CDN
          # error should not fail the whole release.
          for attempt in 1 2 3; do
            if bash package/scripts/bootstrap_vcpkg.sh package; then
              echo "reused=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "bootstrap attempt ${attempt} failed; retrying" >&2
            sleep 30
          done
          echo "bootstrap failed after 3 attempts" >&2
          exit 1

      - name: Save the vcpkg install tree
        if: steps.bootstrap.outputs.reused == 'false'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: package/vcpkg_installed
          key: vcpkg-tree-${{ runner.os }}-msvc-${{ steps.toolchain.outputs.version }}-${{ hashFiles('vcpkg.json') }}

      # Hand the installed tree and the toolchain scripts to the wheel jobs as
      # artifacts; they then never invoke vcpkg.
      - name: Upload the installed vcpkg tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-vcpkg-installed
          path: package/vcpkg_installed
          if-no-files-found: error
          retention-days: 7

      - name: Upload the vcpkg toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-vcpkg-toolchain
          path: |
            .cache/vcpkg/scripts
            .cache/vcpkg/triplets
            .cache/vcpkg/vcpkg.exe
            .cache/vcpkg/bootstrap-vcpkg.bat
          if-no-files-found: error
          retention-days: 7

  wheels-windows:
    name: Build Windows x64 wheels (cp${{ matrix.minor }})
    needs: [source-package, windows-vcpkg]
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - minor: "310"
          - minor: "311"
          - minor: "312"
          - minor: "313"
          - minor: "314"
    defaults:
      run:
        shell: bash
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
      VCPKG_TARGET_TRIPLET: x64-windows-static-release
      VCPKG_HOST_TRIPLET: x64-windows-static-release
    steps:
      - name: Preserve source bytes on Windows checkout
        run: git config --global core.autocrlf false

      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the exact source package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-sdist
          path: dist

      - name: Extract the exact source package
        id: package
        run: |
          tarball="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$tarball"
          rm -rf package
          mkdir -p package
          tar --extract --gzip --file "$tarball" --directory package --strip-components=1
          test -f package/pyproject.toml
          echo "path=package" >> "$GITHUB_OUTPUT"

      - name: Download the installed vcpkg tree
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-vcpkg-installed
          path: package/vcpkg_installed

      - name: Download the vcpkg toolchain
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-vcpkg-toolchain
          path: .cache/vcpkg

      # vcpkg's toolchain locates its checkout root through this marker; the
      # artifact omits dotted entries, so recreate the marker here.
      - name: Mark the vcpkg checkout root
        run: touch .cache/vcpkg/.vcpkg-root

      - name: Install release validation tooling
        run: python -m pip install --upgrade packaging

      # The static vcpkg triplet needs its toolchain so module-mode lookups
      # (for example FindZLIB from curl's package config) resolve against the
      # repo-local install. cibuildwheel parses config settings with shlex, so
      # every path is kept in POSIX form.
      - name: Configure the vcpkg toolchain for the wheel build
        run: |
          workspace="$(cygpath -m "$GITHUB_WORKSPACE")"
          settings="cmake.define.CMAKE_TOOLCHAIN_FILE=$workspace/.cache/vcpkg/scripts/buildsystems/vcpkg.cmake"
          settings="$settings cmake.define.VCPKG_INSTALLED_DIR=$workspace/package/vcpkg_installed"
          settings="$settings cmake.define.VCPKG_TARGET_TRIPLET=x64-windows-static-release"
          settings="$settings cmake.define.VCPKG_MANIFEST_MODE=OFF"
          settings="$settings cmake.define.CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          settings="$settings cmake.define.DISABLE_UNITY=1"
          settings="$settings build.tool-args=/m"
          settings="$settings cmake.define.VANE_ENABLE_TESTPYPI_EXTENSION_SIGNING_KEY=${{ inputs.operation == 'testpypi-dev' && 'ON' || 'OFF' }}"
          echo "CIBW_CONFIG_SETTINGS=$settings" >> "$GITHUB_ENV"

      - name: Build the cp${{ matrix.minor }} wheel from the source package
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_BUILD: cp${{ matrix.minor }}-win_amd64
        with:
          package-dir: ${{ steps.package.outputs.path }}
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"
          # The uv build frontend needs a uv binary on PATH; host runners do
          # not provide one, so let the action install and expose it.
          extras: uv

      - name: Validate the wheel
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
        run: |
          test "$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          python scripts/check_release_artifacts.py --expected-version "$EXPECTED_VERSION" wheelhouse/*.whl

      - name: Verify the final CPython 3.12 wheel coexists with DuckDB
        if: matrix.minor == '312'
        run: |
          wheel="$(find wheelhouse -maxdepth 1 -type f -name '*-cp312-cp312-win_amd64.whl' -print)"
          test -n "$wheel"
          test "$(printf '%s\n' "$wheel" | wc -l)" -eq 1
          python scripts/verify_duckdb_coexistence.py "$wheel"

      - name: Apply private content rules to the wheel
        if: ${{ inputs.operation == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --content-rules-manifest - \
              --expected-version "$EXPECTED_VERSION" \
              wheelhouse/*.whl

      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheels-windows-cp${{ matrix.minor }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Validate, attest and sign artifacts
    needs: [source-package, wheels-linux, wheels-macos, wheels-windows]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --upgrade packaging

      - name: Download source package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-sdist
          path: packages

      - name: Download wheels
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-wheels-*
          path: packages
          merge-multiple: true

      - name: Validate the complete distribution set
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
        run: |
          test "$(find packages -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find packages -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 15
          python scripts/check_release_artifacts.py \
            --expected-version "$EXPECTED_VERSION" \
            packages/*.tar.gz packages/*.whl

      - name: Apply private content rules to the distribution set
        if: ${{ inputs.operation == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --content-rules-manifest - \
              --expected-version "$EXPECTED_VERSION" \
              packages/*.tar.gz packages/*.whl

      - name: Generate checksums
        run: |
          mkdir -p release-assets
          (cd packages && sha256sum *.tar.gz *.whl) > release-assets/SHA256SUMS

      - name: Generate a CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: packages
          format: cyclonedx-json
          output-file: release-assets/vane-ai-sbom.cdx.json
          upload-artifact: false

      - name: Attest distribution provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/packages/*

      - name: Preserve the provenance bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            release-assets/vane-ai-build-provenance.sigstore.json

      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84 # v3.0.1
        with:
          inputs: |
            packages/*.tar.gz
            packages/*.whl

      - name: Upload clean Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            packages/*.tar.gz
            packages/*.whl
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums, SBOM, provenance and signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-supplemental
          path: |
            release-assets/*
            packages/*.sigstore.json
          if-no-files-found: error
          retention-days: 30

  verify-github-assets:
    name: Validate GitHub Release assets
    needs: assemble
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-distributions
          path: release-files

      - name: Download supplemental assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-supplemental
          path: release-files

      - name: Validate the complete nested asset set before any publication
        run: python -I scripts/publish_release_assets.py check --directory release-files

  publish-testpypi:
    name: Publish to TestPyPI
    if: inputs.operation == 'release' || inputs.operation == 'testpypi-dev'
    needs: [assemble, verify-github-assets]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vane-ai
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-distributions
          path: dist

      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify the TestPyPI candidate (${{ matrix.label }})
    if: inputs.operation == 'release' || inputs.operation == 'testpypi-dev'
    needs:
      - assemble
      - publish-testpypi
      - source-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: manylinux x86-64
            wheel_glob: "*-cp312-cp312-manylinux_2_28_x86_64.whl"
          - os: macos-15
            label: macOS arm64
            wheel_glob: "*-cp312-cp312-macosx_*_arm64.whl"
          - os: windows-2022
            label: Windows x64
            wheel_glob: "*-cp312-cp312-win_amd64.whl"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the release distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-distributions
          path: release-files

      - name: Download and install the indexed candidate
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
          INDEX_URL: https://test.pypi.org/simple/
          WHEEL_GLOB: ${{ matrix.wheel_glob }}
        run: |
          python -m pip install --upgrade pip
          version="$EXPECTED_VERSION"
          indexed_wheel=""
          for attempt in 1 2 3 4 5; do
            candidate_dir="$RUNNER_TEMP/testpypi-candidate-$attempt"
            mkdir -p "$candidate_dir"
            if python -m pip download \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url "$INDEX_URL" \
              --dest "$candidate_dir" \
              "vane-ai==$version"; then
              indexed_wheel="$(find "$candidate_dir" -maxdepth 1 -type f -name '*.whl' -print)"
              break
            fi
            sleep 15
          done
          test -n "$indexed_wheel"
          test "$(printf '%s\n' "$indexed_wheel" | wc -l)" -eq 1

          expected_wheel="$(find release-files -maxdepth 1 -type f -name "$WHEEL_GLOB" -print)"
          test -n "$expected_wheel"
          test "$(printf '%s\n' "$expected_wheel" | wc -l)" -eq 1
          cmp "$expected_wheel" "$indexed_wheel"

          python -m pip install "$indexed_wheel"
          python -m pip check

      - name: Extract the public smoke test from the sdist
        run: |
          sdist="$(find release-files -maxdepth 1 -type f -name '*.tar.gz' -print)"
          test -n "$sdist"
          test "$(printf '%s\n' "$sdist" | wc -l)" -eq 1
          smoke_dir="$PWD/vane-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"
          python - "$sdist" "$smoke_dir" <<'PY'
          import pathlib
          import sys
          import tarfile

          sdist, destination = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          with tarfile.open(sdist) as archive:
              member = next(
                  member
                  for member in archive.getmembers()
                  if member.isfile() and member.name.endswith("/scripts/verify_base_install.py")
              )
              (destination / "verify_base_install.py").write_bytes(archive.extractfile(member).read())
          PY
          test -f "$smoke_dir/verify_base_install.py"

      - name: Run the public smoke test outside a source checkout
        run: |
          cd vane-smoke
          env -u VANE_RUNNER python -X utf8 verify_base_install.py

  publish-pypi:
