name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build only, publish a main-branch dev candidate, or publish an existing draft release
        type: choice
        options:
          - build-only
          - testpypi-dev
          - release
        default: build-only
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-package:
    name: Build source package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package_version.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install --upgrade build packaging pip

      - name: Validate the release request
        if: inputs.operation == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          release_version="$(python - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys

          from packaging.version import InvalidVersion, Version

          raw_version = sys.argv[1]
          try:
              version = Version(raw_version)
          except InvalidVersion:
              raise SystemExit(f"release tag does not contain a valid PEP 440 version: {raw_version!r}") from None
          if str(version) != raw_version:
              raise SystemExit(f"release tag must use canonical PEP 440 spelling: v{version}")
          if version.epoch != 0 or len(version.release) != 3:
              raise SystemExit("release tags must use an X.Y.Z version without an epoch")
          if version.is_devrelease or version.local is not None:
              raise SystemExit("release tags cannot use development or local versions")
          print(version)
          PY
          )"
          test "$GITHUB_REF_NAME" = "v$release_version"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VANE_AI=$release_version" >> "$GITHUB_ENV"

          release_commit="$(git rev-parse HEAD^{commit})"
          release_branch="$(python - "$release_version" <<'PY'
          import sys
          from packaging.version import Version

          version = Version(sys.argv[1])
          major, minor, patch = version.release
          if patch == 0 and version.post is None:
              print("main")
          else:
              print(f"release/{major}.{minor}")
          PY
          )"
          release_ref="refs/remotes/origin/$release_branch"
          git fetch --no-tags origin "refs/heads/$release_branch:$release_ref"
          git merge-base --is-ancestor "$release_commit" "$release_ref" || {
            echo "v$release_version must be reachable from $release_branch" >&2
            exit 1
          }

          release_id="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq --slurp --raw-output --arg tag "$GITHUB_REF_NAME" '
                [
                  .[][]
                  | select(
                      .tag_name == $tag
                      and .draft
                      and ((.body // "") | length > 0)
                    )
                  | .id
                ]
                | if length == 1 then .[0] else empty end
              '
          )"
          test -n "$release_id"

          python - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          version = urllib.parse.quote(sys.argv[1], safe="")
          for index in ("https://test.pypi.org", "https://pypi.org"):
              url = f"{index}/pypi/vane-ai/{version}/json"
              try:
                  with urllib.request.urlopen(url, timeout=30):
                      pass
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      continue
                  raise
              raise SystemExit(f"vane-ai {sys.argv[1]} already exists on {index}")
          PY

      - name: Build the source package
        run: |
          python -m build --sdist --outdir dist

      - name: Record and validate the package version
        id: package_version
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          path="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$path"
          version="$(python - "$path" <<'PY'
          import sys
          from pathlib import Path

          from packaging.utils import parse_sdist_filename

          _, version = parse_sdist_filename(Path(sys.argv[1]).name)
          print(version)
          PY
          )"
          if test "$OPERATION" = "release"; then
            test "$GITHUB_REF_NAME" = "v$version"
          elif test "$OPERATION" = "testpypi-dev"; then
            python scripts/validate_testpypi_candidate.py \
              --version "$version" \
              --github-ref "$GITHUB_REF"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python scripts/check_release_artifacts.py --expected-version "$version" "$path"

      - name: Apply private content rules to the source package
        if: ${{ inputs.operation == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
        env:
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --content-rules-manifest - \
              --expected-version "${{ steps.package_version.outputs.version }}" \
              dist/*.tar.gz

      - name: Upload source package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  wheels:
    name: Build manylinux wheels
    needs: source-package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --upgrade packaging

      - name: Download the exact source package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-sdist
          path: dist

      - name: Locate source package
        id: sdist
        run: |
          path="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build wheels from the source package
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_CONFIG_SETTINGS: "cmake.define.VANE_ENABLE_TESTPYPI_EXTENSION_SIGNING_KEY=${{ inputs.operation == 'testpypi-dev' && 'ON' || 'OFF' }}"
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"

      - name: Validate wheels
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
        run: |
          test "$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 5
          python scripts/check_release_artifacts.py --expected-version "$EXPECTED_VERSION" wheelhouse/*.whl

      - name: Verify the final CPython 3.12 wheel coexists with DuckDB
        run: |
          wheel="$(find wheelhouse -maxdepth 1 -type f -name '*-cp312-cp312-*.whl' -print)"
          test -n "$wheel"
          test "$(printf '%s\n' "$wheel" | wc -l)" -eq 1
          python scripts/verify_duckdb_coexistence.py "$wheel"

      - name: Apply private content rules to wheels
        if: ${{ inputs.operation == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --content-rules-manifest - \
              --expected-version "$EXPECTED_VERSION" \
              wheelhouse/*.whl

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Validate, attest and sign artifacts
    needs: [source-package, wheels]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install --upgrade packaging

      - name: Download source package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-sdist
          path: packages

      - name: Download wheels
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-wheels
          path: packages

      - name: Validate the complete distribution set
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
        run: |
          test "$(find packages -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find packages -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 5
          python scripts/check_release_artifacts.py \
            --expected-version "$EXPECTED_VERSION" \
            packages/*.tar.gz packages/*.whl

      - name: Apply private content rules to the distribution set
        if: ${{ inputs.operation == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
          RELEASE_ARTIFACT_CONTENT_RULES: ${{ secrets.RELEASE_ARTIFACT_CONTENT_RULES }}
        run: |
          test -n "$RELEASE_ARTIFACT_CONTENT_RULES"
          printf '%s' "$RELEASE_ARTIFACT_CONTENT_RULES" |
            python scripts/check_release_artifacts.py \
              --content-rules-manifest - \
              --expected-version "$EXPECTED_VERSION" \
              packages/*.tar.gz packages/*.whl

      - name: Generate checksums
        run: |
          mkdir -p release-assets
          (cd packages && sha256sum *.tar.gz *.whl) > release-assets/SHA256SUMS

      - name: Generate a CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: packages
          format: cyclonedx-json
          output-file: release-assets/vane-ai-sbom.cdx.json
          upload-artifact: false

      - name: Attest distribution provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/packages/*

      - name: Preserve the provenance bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            release-assets/vane-ai-build-provenance.sigstore.json

      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84 # v3.0.1
        with:
          inputs: |
            packages/*.tar.gz
            packages/*.whl

      - name: Upload clean Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            packages/*.tar.gz
            packages/*.whl
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums, SBOM, provenance and signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-supplemental
          path: |
            release-assets/*
            packages/*.sigstore.json
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    name: Publish to TestPyPI
    if: inputs.operation == 'release' || inputs.operation == 'testpypi-dev'
    needs: assemble
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vane-ai
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-distributions
          path: dist

      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify the TestPyPI candidate
    if: inputs.operation == 'release' || inputs.operation == 'testpypi-dev'
    needs:
      - assemble
      - publish-testpypi
      - source-package
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the release distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-distributions
          path: release-files

      - name: Download and install the indexed candidate
        env:
          EXPECTED_VERSION: ${{ needs['source-package'].outputs.version }}
          INDEX_URL: https://test.pypi.org/simple/
        run: |
          python -m pip install --upgrade pip
          version="$EXPECTED_VERSION"
          indexed_wheel=""
          for attempt in 1 2 3 4 5; do
            candidate_dir="$RUNNER_TEMP/testpypi-candidate-$attempt"
            mkdir -p "$candidate_dir"
            if python -m pip download \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url "$INDEX_URL" \
              --dest "$candidate_dir" \
              "vane-ai==$version"; then
              indexed_wheel="$(find "$candidate_dir" -maxdepth 1 -type f -name '*.whl' -print)"
              break
            fi
            sleep 15
          done
          test -n "$indexed_wheel"
          test "$(printf '%s\n' "$indexed_wheel" | wc -l)" -eq 1

          expected_wheel="$(find release-files -maxdepth 1 -type f -name '*-cp312-cp312-*.whl' -print)"
          test -n "$expected_wheel"
          test "$(printf '%s\n' "$expected_wheel" | wc -l)" -eq 1
          cmp "$expected_wheel" "$indexed_wheel"

          python -m pip install "$indexed_wheel"
          python -m pip check

      - name: Extract the public smoke test from the sdist
        run: |
          sdist="$(find release-files -maxdepth 1 -type f -name '*.tar.gz' -print)"
          test -n "$sdist"
          test "$(printf '%s\n' "$sdist" | wc -l)" -eq 1
          mkdir -p "$RUNNER_TEMP/vane-smoke"
          tar \
            --extract \
            --gzip \
            --file "$sdist" \
            --directory "$RUNNER_TEMP/vane-smoke" \
            --strip-components=2 \
            --wildcards \
            '*/scripts/verify_base_install.py'
          test -f "$RUNNER_TEMP/vane-smoke/verify_base_install.py"

      - name: Run the public smoke test outside a source checkout
        working-directory: ${{ runner.temp }}
        run: env -u VANE_RUNNER python "$RUNNER_TEMP/vane-smoke/verify_base_install.py"

  publish-pypi:
    name: Publish to PyPI
    if: inputs.operation == 'release'
    needs: verify-testpypi
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/vane-ai
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-distributions
          path: dist

      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  verify-pypi:
    name: Verify the PyPI distributions
    if: inputs.operation == 'release'
    needs:
      - assemble
      - publish-pypi
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the release distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-distributions
          path: release-files

      - name: Download and install the indexed distribution
        env:
          INDEX_URL: https://pypi.org/simple/
        run: |
          python -m pip install --upgrade pip
          version="${GITHUB_REF_NAME#v}"
          indexed_wheel=""
          for attempt in 1 2 3 4 5; do
            candidate_dir="$RUNNER_TEMP/pypi-candidate-$attempt"
            mkdir -p "$candidate_dir"
            if python -m pip download \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url "$INDEX_URL" \
              --dest "$candidate_dir" \
              "vane-ai==$version"; then
              indexed_wheel="$(find "$candidate_dir" -maxdepth 1 -type f -name '*.whl' -print)"
              break
            fi
            sleep 15
          done
          test -n "$indexed_wheel"
          test "$(printf '%s\n' "$indexed_wheel" | wc -l)" -eq 1

          expected_wheel="$(find release-files -maxdepth 1 -type f -name '*-cp312-cp312-*.whl' -print)"
          test -n "$expected_wheel"
          test "$(printf '%s\n' "$expected_wheel" | wc -l)" -eq 1
          cmp "$expected_wheel" "$indexed_wheel"

          python -m pip install "$indexed_wheel"
          python -m pip check

      - name: Extract the public smoke test from the sdist
        run: |
          sdist="$(find release-files -maxdepth 1 -type f -name '*.tar.gz' -print)"
          test -n "$sdist"
          test "$(printf '%s\n' "$sdist" | wc -l)" -eq 1
          mkdir -p "$RUNNER_TEMP/vane-smoke"
          tar \
            --extract \
            --gzip \
            --file "$sdist" \
            --directory "$RUNNER_TEMP/vane-smoke" \
            --strip-components=2 \
            --wildcards \
            '*/scripts/verify_base_install.py'
          test -f "$RUNNER_TEMP/vane-smoke/verify_base_install.py"

      - name: Run the public smoke test outside a source checkout
        working-directory: ${{ runner.temp }}
        run: env -u VANE_RUNNER python "$RUNNER_TEMP/vane-smoke/verify_base_install.py"

  publish-github-release:
    name: Publish the draft GitHub Release
    if: inputs.operation == 'release'
    needs:
      - assemble
      - verify-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-distributions
          path: release-files

      - name: Download supplemental assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-supplemental
          path: release-files

      - name: Attach assets to the draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
          test "$draft" = "true"

          # release-supplemental is packed from two source directories, so the
          # artifact keeps its packages/ and release-assets/ prefixes. The
          # non-recursive release-files/* used to hand gh those directories,
          # which it rejects only after uploading the assets ahead of them.
          #
          # Collection, the basename-collision guard and the expected-inventory
          # assertion all live in the script so they can be tested; it exits
          # non-zero on any of them, which set -e turns into a failed step
          # before a single asset is uploaded.
          python scripts/check_release_assets.py collect release-files --output upload-list

          # NUL-delimited, so a name containing whitespace survives the round
          # trip. mapfile's own status is the one checked here -- the script
          # already failed the step above if collection went wrong.
          mapfile -d '' -t assets < upload-list

          echo "attaching ${#assets[@]} asset(s)"
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

      - name: Verify every asset reached the draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Comparing names alone passes for a truncated upload and for stale
          # assets left on the release by an earlier run, so both sides are
          # reduced to (name, size, sha256) and required to match exactly.
          # Assigning in its own statement, not inside an `if`, keeps this
          # under set -e: a failure here must fail the step, not read as false.
          gh release view "$GITHUB_REF_NAME" --json assets > remote-assets.json
          python scripts/check_release_assets.py verify release-files --remote remote-assets.json

      - name: Publish the complete draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
