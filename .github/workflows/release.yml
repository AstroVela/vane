          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-distributions
          path: release-files

      - name: Download supplemental assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-supplemental
          path: release-files

      - name: Attach missing assets and verify the complete draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I scripts/publish_release_assets.py publish --directory release-files \
            --repository "$GH_REPO" --tag "$GITHUB_REF_NAME"

      - name: Publish the complete draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
