name: Build contracts

on:
  pull_request:
    paths:
      - 'cmake/duckdb_loader.cmake'
      - 'external/duckdb/src/include/duckdb/function/**'
      - 'tests/fast/test_header_linkage.py'
      - 'tests/fast/test_loadable_extension_configuration.py'
      - '.github/workflows/build-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install contract-test tools
        run: python -m pip install cmake==4.4.4 ninja==1.13.2 pytest==9.1.1
      - name: Check configured static links and both header orders
        run: |
          if ($IsWindows) {
            $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
            Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          }
          python -I -m pytest --noconftest -o 'addopts=' tests/fast/test_loadable_extension_configuration.py tests/fast/test_header_linkage.py -q
