exclude: ^external/duckdb/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict
      - id: forbid-new-submodules

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: 7c55798a78262d14b2074abf623d8a992ebb70d4 # frozen: v0.16.2
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--no-fix]
      # Run the formatter.
      - id: ruff-format
      - id: ruff-format
        alias: ruff-format-check
        name: ruff format (check)
        args: [--check]
        stages: [manual]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    # Root formatter only. external/duckdb uses DuckDB's own clang-format 11 formatter.
    rev: f4d7745e17a28aad7eed2f4874ca8d1568c11c4c # frozen: v22.1.8
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx|ipp)$
      - id: clang-format
        alias: clang-format-check
        name: clang-format (check)
        entry: clang-format --dry-run --Werror
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx|ipp)$
        stages: [manual]

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: e2c2116d86a80e72e7146a06e68b7c228afc6319 # frozen: v0.6.13
    hooks:
      - id: cmake-format
      - id: cmake-format
        alias: cmake-format-check
        name: cmake-format (check)
        entry: cmake-format --check
        args: []
        stages: [manual]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8 # frozen: 0.38.0
    hooks:
      - id: check-dependabot
      - id: check-github-issue-config
      - id: check-github-issue-forms
      - id: check-github-workflows

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 41e691678310dfd3833f7ab4e180ddb014310356 # frozen: v2.3.0
    hooks:
      - id: mypy
        entry: mypy
        files: ^vane/
        exclude: ^vane/(experimental|query_graph)/
        # Check the package once so colocated runtime modules and .pyi files are
        # resolved normally instead of being passed as duplicate source roots.
        pass_filenames: false
        args:
          - "--package=vane"
          - "--follow-imports=skip"
          - "--allow-subclassing-any"
          - "--allow-untyped-decorators"
          - "--no-warn-return-any"
          - "--no-warn-unused-ignores"
        # Keep NumPy stubs compatible with mypy's Python 3.10 target while
        # allowing the NumPy 2.3 wheels available to Python 3.14 hooks.
        additional_dependencies: ["numpy<2.4", polars]

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt -w -ln=bash -i=2 -ci -bn
        language: system
        types: [shell]
      - id: shfmt-check
        name: shfmt (check)
        entry: shfmt -d -ln=bash -i=2 -ci -bn
        language: system
        types: [shell]
        stages: [manual]
