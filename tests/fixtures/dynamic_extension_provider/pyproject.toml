[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vane-test-dynamic-extension-provider"
version = "0.0.0"
description = "CI-only signed dynamic extension provider for Vane"
requires-python = ">=3.10"

[project.entry-points."vane.dynamic_extension_providers"]
loadable_extension_demo = "vane_test_dynamic_extension_provider:create_provider"

[tool.setuptools]
py-modules = ["vane_test_dynamic_extension_provider"]
